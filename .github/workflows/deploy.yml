name: Validate Next.js server
on:
  pull_request:
    branches: [main, feature/admin]
  push:
    branches: [main, feature/admin]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
# Runtime APIs require Node.js hosting. GitHub Pages cannot host this application.
# Production database migrations are an explicit release step, never a PR build side effect.
